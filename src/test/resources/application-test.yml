server:
  port: 0

spring:
  application:
    name: employee-leave-platform-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false # Use Hibernate create-drop for fast H2 test execution

app:
  jwt:
    secret: TestingSecretKeyForUnitAndIntegrationTestsThatMeetsThe256BitRequirement1234567890!
    expiration-ms: 3600000 # 1 hour

logging:
  level:
    root: INFO
    com.company.employeeleave: DEBUG
